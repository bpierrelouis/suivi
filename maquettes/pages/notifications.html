<script>
  // US-27/28 : notifications internes propres à chaque destinataire, lues/non lues.
  function utilisateurCourant() {
    return StockFlowData.utilisateurs.find((u) => u.nom === StockFlowRole.nom());
  }

  function renderNotifications() {
    const u = utilisateurCourant();
    const liste = u ? StockFlowData.notificationsDe(u.id).slice().reverse() : [];
    const nonLues = liste.filter((n) => !n.lu).length;

    document.getElementById("notif-count").textContent =
      `${liste.length} notification${liste.length > 1 ? "s" : ""}${nonLues ? ` · ${nonLues} non lue${nonLues > 1 ? "s" : ""}` : ""}`;
    document.getElementById("btn-tout-marquer-lu").style.display = nonLues ? "inline-flex" : "none";

    document.getElementById("notifications-list").innerHTML = liste.map((n) => `
      <div class="member-row" style="align-items:flex-start;">
        <span class="member-row__avatar" style="background:${n.lu ? "var(--bg)" : "var(--info-soft)"}; color:${n.lu ? "var(--text-muted)" : "var(--info)"};">
          <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </span>
        <span class="member-row__meta">
          <span class="member-row__name" style="font-weight:${n.lu ? "500" : "700"};">${n.message}</span><br>
          <span class="member-row__email">${n.date}</span>
        </span>
        ${n.lu ? `<span class="badge badge-neutral">Lue</span>` : `<button class="btn btn-secondary btn-sm" data-marquer-lue="${n.id}" style="margin-left:12px;">Marquer comme lue</button>`}
      </div>
    `).join("") || `<p class="text-muted" style="font-size:13px;">Aucune notification pour le moment.</p>`;
  }
  renderNotifications();
  document.addEventListener("rolechange", renderNotifications);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-marquer-lue]");
    if (btn) {
      StockFlowData.marquerNotificationLue(btn.getAttribute("data-marquer-lue"));
      renderNotifications();
      if (typeof window.rafraichirClocheNotifications === "function") window.rafraichirClocheNotifications();
    }
  });

  document.getElementById("btn-tout-marquer-lu").addEventListener("click", () => {
    const u = utilisateurCourant();
    if (!u) return;
    StockFlowData.notificationsDe(u.id).forEach((n) => StockFlowData.marquerNotificationLue(n.id));
    renderNotifications();
    if (typeof window.rafraichirClocheNotifications === "function") window.rafraichirClocheNotifications();
  });
</script>
